name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 cmdline-tools;latest"
      - name: Capture source commit before export
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify public source export
        shell: bash
        run: ./scripts/export-public-source.sh "$RUNNER_TEMP/DuoLauncher-public"
      - name: Build, test, lint, and check optimized release compilation
        working-directory: ${{ runner.temp }}/DuoLauncher-public
        env:
          DUO_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Upload development debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duo-launcher-debug-development-${{ github.sha }}
          path: ${{ runner.temp }}/DuoLauncher-public/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit-test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duo-launcher-ci-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/DuoLauncher-public/app/build/reports/tests/testDebugUnitTest/**
            ${{ runner.temp }}/DuoLauncher-public/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
