name: Build signed release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Optional safe versionName override; leave empty to use the configured project value.
        required: false
        type: string
      version_code:
        description: Required Android versionCode (1 through 2100000000; must exceed every distributed update).
        required: true
        type: string
      create_draft_release:
        description: Create an unpublished GitHub draft release after verification.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign_and_package:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-release
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      application_id: ${{ steps.metadata.outputs.application_id }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      draft_tag: ${{ steps.names.outputs.draft_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 cmdline-tools;latest"
      - name: Capture exact source commit before export
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" == "$GITHUB_SHA" ]] || { echo "Checkout did not resolve to the workflow commit." >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Validate release inputs and fork identity
        shell: bash
        env:
          DUO_APPLICATION_ID: ${{ vars.DUO_APPLICATION_ID }}
          DUO_VERSION_CODE: ${{ inputs.version_code }}
          DUO_VERSION_NAME: ${{ inputs.version_name }}
        run: ./scripts/validate-release-config.sh --require-fork-id
      - name: Validate required signing configuration
        shell: bash
        env:
          DUO_RELEASE_KEYSTORE_BASE64: ${{ secrets.DUO_RELEASE_KEYSTORE_BASE64 }}
          DUO_RELEASE_STORE_PASSWORD: ${{ secrets.DUO_RELEASE_STORE_PASSWORD }}
          DUO_RELEASE_KEY_ALIAS: ${{ secrets.DUO_RELEASE_KEY_ALIAS }}
          DUO_RELEASE_KEY_PASSWORD: ${{ secrets.DUO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in DUO_RELEASE_KEYSTORE_BASE64 DUO_RELEASE_STORE_PASSWORD DUO_RELEASE_KEY_ALIAS DUO_RELEASE_KEY_PASSWORD; do
            [[ -n "${!secret_name:-}" ]] || { echo "Missing android-release signing configuration: $secret_name." >&2; exit 1; }
          done
      - name: Export validated public source
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/export-public-source.sh "$RUNNER_TEMP/DuoLauncher-public"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/DuoLauncher-public-source.tar.gz" DuoLauncher-public
      - name: Read effective build metadata
        id: metadata
        working-directory: ${{ runner.temp }}/DuoLauncher-public
        shell: bash
        env:
          DUO_APPLICATION_ID: ${{ vars.DUO_APPLICATION_ID }}
          DUO_VERSION_CODE: ${{ inputs.version_code }}
          DUO_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --quiet :app:printReleaseMetadata > "$RUNNER_TEMP/duo-release-metadata"
          application_id=$(sed -n 's/^applicationId=//p' "$RUNNER_TEMP/duo-release-metadata")
          version_code=$(sed -n 's/^versionCode=//p' "$RUNNER_TEMP/duo-release-metadata")
          version_name=$(sed -n 's/^versionName=//p' "$RUNNER_TEMP/duo-release-metadata")
          [[ -n "$application_id" && -n "$version_code" && -n "$version_name" ]] || { echo "Gradle did not return release metadata." >&2; exit 1; }
          printf 'application_id=%s\nversion_code=%s\nversion_name=%s\n' "$application_id" "$version_code" "$version_name" >> "$GITHUB_OUTPUT"
      - name: Name release files and archive the source
        id: names
        shell: bash
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          base="DuoLauncher-${VERSION_NAME}-${VERSION_CODE}-build${GITHUB_RUN_NUMBER}"
          mkdir -p "$RUNNER_TEMP/duo-release-output"
          mv "$RUNNER_TEMP/DuoLauncher-public-source.tar.gz" "$RUNNER_TEMP/duo-release-output/${base}-source.tar.gz"
          printf 'base=%s\nartifact_name=duo-launcher-signed-%s-%s-build%s\ndraft_tag=duolauncher-fork-v%s-%s\n' \
            "$base" "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_RUN_NUMBER" "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Decode release keystore outside source trees
        shell: bash
        env:
          DUO_RELEASE_KEYSTORE_BASE64: ${{ secrets.DUO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$DUO_RELEASE_KEYSTORE_BASE64" ]] || { echo "Missing android-release secret DUO_RELEASE_KEYSTORE_BASE64." >&2; exit 1; }
          umask 077
          keystore="$RUNNER_TEMP/duo-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keystore"
          printf '%s' "$DUO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore" || { rm -f "$keystore"; echo "DUO_RELEASE_KEYSTORE_BASE64 is not valid Base64." >&2; exit 1; }
          [[ -s "$keystore" ]] || { rm -f "$keystore"; echo "Decoded keystore is empty." >&2; exit 1; }
          chmod 600 "$keystore"
          echo "DUO_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Build, test, lint, signed APK, and signed AAB
        working-directory: ${{ runner.temp }}/DuoLauncher-public
        shell: bash
        env:
          DUO_APPLICATION_ID: ${{ vars.DUO_APPLICATION_ID }}
          DUO_VERSION_CODE: ${{ inputs.version_code }}
          DUO_VERSION_NAME: ${{ inputs.version_name }}
          DUO_RELEASE_STORE_PASSWORD: ${{ secrets.DUO_RELEASE_STORE_PASSWORD }}
          DUO_RELEASE_KEY_ALIAS: ${{ secrets.DUO_RELEASE_KEY_ALIAS }}
          DUO_RELEASE_KEY_PASSWORD: ${{ secrets.DUO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in DUO_RELEASE_STORE_FILE DUO_RELEASE_STORE_PASSWORD DUO_RELEASE_KEY_ALIAS DUO_RELEASE_KEY_PASSWORD; do
            [[ -n "${!secret_name:-}" ]] || { echo "Missing android-release signing configuration: $secret_name." >&2; exit 1; }
          done
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease
      - name: Verify signed APK and AAB
        shell: bash
        env:
          DUO_RELEASE_STORE_PASSWORD: ${{ secrets.DUO_RELEASE_STORE_PASSWORD }}
          DUO_RELEASE_KEY_ALIAS: ${{ secrets.DUO_RELEASE_KEY_ALIAS }}
          DUO_RELEASE_KEY_PASSWORD: ${{ secrets.DUO_RELEASE_KEY_PASSWORD }}
          APPLICATION_ID: ${{ steps.metadata.outputs.application_id }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          BASE: ${{ steps.names.outputs.base }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/DuoLauncher-public"
          output_dir="$RUNNER_TEMP/duo-release-output"
          cp -p "$source_dir/app/build/outputs/apk/release/app-release.apk" "$output_dir/$BASE.apk"
          cp -p "$source_dir/app/build/outputs/bundle/release/app-release.aab" "$output_dir/$BASE.aab"
          cp -p "$source_dir/app/build/outputs/mapping/release/mapping.txt" "$output_dir/$BASE-mapping.txt"
          ./scripts/verify-release-artifacts.sh --apk "$output_dir/$BASE.apk" --aab "$output_dir/$BASE.aab" \
            --application-id "$APPLICATION_ID" --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --fingerprint-out "$RUNNER_TEMP/duo-signing-fingerprint"
      - name: Write checksums, metadata, and release summary
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          APPLICATION_ID: ${{ steps.metadata.outputs.application_id }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          BASE: ${{ steps.names.outputs.base }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/duo-release-output"
          fingerprint=$(<"$RUNNER_TEMP/duo-signing-fingerprint")
          cat > "$output_dir/BUILD-METADATA.txt" <<EOF
          source_commit=$SOURCE_COMMIT
          application_id=$APPLICATION_ID
          version_name=$VERSION_NAME
          version_code=$VERSION_CODE
          signing_certificate_sha256=$fingerprint
          EOF
          (cd "$output_dir" && sha256sum "$BASE.apk" "$BASE.aab" "$BASE-source.tar.gz" BUILD-METADATA.txt > SHA256SUMS.txt)
          {
            echo "## Signed Android build"
            echo
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo "- Application ID: \`$APPLICATION_ID\`"
            echo "- Version: \`$VERSION_NAME\` (code \`$VERSION_CODE\`)"
            echo "- Signing certificate SHA-256: \`$fingerprint\`"
            echo "- Install \`$BASE.apk\` on a phone. Upload \`$BASE.aab\` to Play Console when you choose to submit it."
            echo "- The mapping file is a diagnostic artifact, not an installable package. Signature verification proves package identity, not production readiness or Play approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/duo-release-output/${{ steps.names.outputs.base }}.apk
            ${{ runner.temp }}/duo-release-output/${{ steps.names.outputs.base }}.aab
            ${{ runner.temp }}/duo-release-output/${{ steps.names.outputs.base }}-source.tar.gz
            ${{ runner.temp }}/duo-release-output/BUILD-METADATA.txt
            ${{ runner.temp }}/duo-release-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload R8 mapping diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duo-launcher-r8-mapping-${{ steps.metadata.outputs.version_name }}-${{ steps.metadata.outputs.version_code }}-build${{ github.run_number }}
          path: ${{ runner.temp }}/duo-release-output/${{ steps.names.outputs.base }}-mapping.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duo-launcher-signed-build-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/DuoLauncher-public/app/build/reports/tests/testDebugUnitTest/**
            ${{ runner.temp }}/DuoLauncher-public/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove decoded release keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/duo-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keystore"

  create_draft_release:
    needs: sign_and_package
    if: inputs.create_draft_release && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign_and_package.outputs.artifact_name }}
          path: release-assets
      - name: Refuse existing tag or release, then create an unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DUO_RELEASE_TAG: ${{ needs.sign_and_package.outputs.draft_tag }}
          DUO_SOURCE_COMMIT: ${{ needs.sign_and_package.outputs.source_commit }}
          DUO_VERSION_NAME: ${{ needs.sign_and_package.outputs.version_name }}
          DUO_VERSION_CODE: ${{ needs.sign_and_package.outputs.version_code }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$DUO_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag: $DUO_RELEASE_TAG" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DUO_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite assets on existing release: $DUO_RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$DUO_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$DUO_SOURCE_COMMIT" --draft \
            --title "DuoLauncher fork $DUO_VERSION_NAME ($DUO_VERSION_CODE)" \
            --notes "Verified signed fork build for commit $DUO_SOURCE_COMMIT. This is a draft and is not published automatically." \
            release-assets/*
